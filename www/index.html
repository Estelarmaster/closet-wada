<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f9f7a">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#f4f5f7}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Clóset Wada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Shippori+Mincho:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: app móvil familiar — saludo y buscador arriba, categorías con íconos, tarjetas redondeadas, barra inferior con botón + al centro */
:root {
  --paper: #f4f5f7;
  --surface: #ffffff;
  --ink: #1d2230;
  --muted: #697184;
  --line: #e3e6ec;
  --accent: #0f9f7a;
  --accent-soft: #e2f5ef;
  --on-accent: #ffffff;
  --danger: #d0453b;
  --shade: rgba(16, 20, 32, .45);
  --shadow: 0 2px 10px rgba(20, 28, 48, .07);
  --f-display: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c; --surface: #1c212b; --ink: #eef0f4; --muted: #9aa2b3; --line: #2b313d;
    --accent: #38c9a0; --accent-soft: #163a31; --on-accent: #0b1a15; --danger: #f07a70; --shade: rgba(0,0,0,.6);
    --shadow: 0 2px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c; --surface: #1c212b; --ink: #eef0f4; --muted: #9aa2b3; --line: #2b313d;
  --accent: #38c9a0; --accent-soft: #163a31; --on-accent: #0b1a15; --danger: #f07a70; --shade: rgba(0,0,0,.6);
  --shadow: 0 2px 12px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }

/* Encabezado */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 20px 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; margin: 0; letter-spacing: .01em; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 46ch; }
.status { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-mode="cloud"]::before { background: #4f8a5e; }
.status[data-mode="local"]::before { background: #c08a2c; }

/* Pestañas */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; gap: 4px; padding-block: 8px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { flex: 1; max-width: 180px; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab:focus-visible, .btn:focus-visible, .chip:focus-visible, .card:focus-visible, .sw:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Botones y chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface); font-weight: 500; }
.chip .n { font-family: var(--f-mono); font-size: 11px; margin-left: 4px; opacity: .7; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h2.sec { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 28px 0 10px; text-wrap: balance; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.note { border: 1px dashed var(--muted); border-radius: var(--r); padding: 10px 14px; font-size: 13.5px; color: var(--muted); margin: 0 0 14px; }
.note b { color: var(--ink); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.actions .primary { grid-column: 1 / -1; }
@media (min-width: 560px) { .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 620px; } .actions .primary { grid-column: auto; } }
.summary { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }

/* Cuadrícula de prendas */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0; overflow: hidden; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--muted); }
.media { aspect-ratio: 4 / 5; width: 100%; max-width: 100%; position: relative; background: var(--paper); overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bands { display: flex; width: 100%; height: 100%; }
.bands span { flex: 1; }
.tag { position: absolute; left: 8px; top: 8px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface); color: var(--ink); padding: 2px 7px; border-radius: 4px; }
.card-body { padding: 10px 12px 12px; display: grid; gap: 4px; min-width: 0; }
.card-name { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); display: block; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* Combinar */
.controls { display: grid; grid-template-columns: 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 16px; }
@media (min-width: 720px) { .controls { grid-template-columns: 1.3fr 1fr; align-items: end; } }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field select, .field input[type="text"], .field input[type="search"] { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 9px 10px; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); }
.outfits { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .outfits { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.outfit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.outfit-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; }
.no { font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.fit { font-size: 12px; color: var(--muted); }
.star { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.star[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.palette { display: flex; min-height: 64px; }
.palette .pal { flex: 1; padding: 8px; display: flex; align-items: flex-end; min-width: 0; }
.palette .pal span { font-family: var(--f-display); font-size: 12px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.pieces { list-style: none; margin: 0; padding: 10px 12px 12px; display: grid; gap: 8px; }
.piece { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; min-width: 0; }
.piece .media { aspect-ratio: 1; border-radius: 6px; }
.piece b { font-weight: 500; font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.piece small { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.piece small i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); display: inline-block; }
.outfit-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 12px; align-items: center; }

/* Diccionario */
.swgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
.sw { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; min-width: 0; }
.sw .chipc { height: 56px; background: var(--c); }
.sw .lbl { padding: 6px 8px; display: grid; gap: 1px; }
.sw .lbl b { font-family: var(--f-display); font-weight: 600; font-size: 12.5px; line-height: 1.2; overflow-wrap: anywhere; }
.sw .lbl span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.swgrid.compact { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); max-height: 300px; overflow-y: auto; padding: 2px; }
.swgrid.compact .chipc { height: 36px; }
.swgrid.compact .lbl b { font-size: 11px; }

/* Hoja inferior */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: var(--shade); border: 0; padding: 0; cursor: default; }
.sheet-panel { position: relative; background: var(--surface); width: 100%; max-width: 600px; max-height: 90%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 720px) { .sheet { align-items: center; } .sheet-panel { border-radius: 16px; max-height: 86%; } }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 14px 10px; z-index: 1; }
.sheet-head h3 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; overflow-wrap: anywhere; }
.sheet-body { display: grid; gap: 16px; }
.hero-img { width: 100%; max-height: 300px; border-radius: var(--r); overflow: hidden; background: var(--paper); }
.hero-img img { width: 100%; max-height: 300px; object-fit: contain; display: block; }
.hero-img .bands { height: 140px; }
.colorrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.colorrow.off { opacity: .45; }
.pair { display: flex; align-items: center; gap: 4px; }
.pair i { width: 30px; height: 30px; border-radius: 6px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); display: block; }
.pair em { font-style: normal; color: var(--muted); font-size: 12px; }
.colorrow .nm { min-width: 0; }
.colorrow .nm b { font-family: var(--f-display); font-weight: 600; display: block; overflow-wrap: anywhere; }
.colorrow .nm span { font-size: 12px; color: var(--muted); }
.weights { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
.weights span { background: var(--c); }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.loading { padding: 30px 0; text-align: center; color: var(--muted); }
.combo-line { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); cursor: pointer; padding: 0; text-align: left; width: 100%; }
.combo-line .strip { display: flex; height: 40px; }
.combo-line .strip span { flex: 1; }
.combo-line .cl-meta { padding: 0 10px; font-size: 12px; text-align: right; }
.list { display: grid; gap: 8px; }
.need { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; }
.need > i { width: 40px; height: 40px; border-radius: 6px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); display: block; }
.need .media { width: 40px; aspect-ratio: 1; border-radius: 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .sheet-panel { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* Reconocimiento con Claude */
.hero-img { text-align: center; }
.imgwrap { position: relative; display: inline-block; max-width: 100%; overflow: hidden; vertical-align: top; }
.imgwrap img { width: auto; max-width: 100%; max-height: 300px; display: block; }
.crop { position: absolute; border: 2px solid var(--accent); border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .38); pointer-events: none; }
.ai-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.ai-line b { color: var(--ink); }
.ai-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .ai-dot.busy { animation: pulse 1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .25; } } }

/* Recorte manual */
.step { margin: 0; font-weight: 500; display: flex; gap: 10px; align-items: baseline; }
.step .mono { color: var(--accent); }
.cutbox { display: flex; justify-content: center; align-items: center; border-radius: var(--r); overflow: hidden; background: repeating-conic-gradient(#cfcfca 0 25%, #ecece8 0 50%) 0 0 / 18px 18px; padding: 8px; }
#cut-canvas { display: block; max-width: 100%; max-height: 56vh; width: auto; height: auto; touch-action: none; cursor: crosshair; }
.cutimg { display: block; max-width: 100%; max-height: 260px; width: auto; }
.cut-sliders { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .cut-sliders { grid-template-columns: 1fr 1fr; } }
.cut-sliders input { width: 100%; accent-color: var(--accent); }
.confirm { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.confirm.off { opacity: .55; }
.confirm .row { grid-column: 1 / -1; }
.cmp { display: flex; align-items: center; gap: 6px; }
.cmp i { width: 48px; height: 48px; border-radius: 8px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); display: block; }
.cmp em { font-style: normal; color: var(--muted); }
.confirm .nm { min-width: 0; display: grid; gap: 2px; }
.confirm .nm b { font-family: var(--f-display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.confirm .nm > span { font-size: 12.5px; color: var(--muted); }
.tagline { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tagline.ok { color: var(--accent); }
.media.cut img { object-fit: contain; padding: 8%; }
.cutbox > img { display: block; max-width: 100%; max-height: 300px; width: auto; }

/* ---------- Estilo familiar ---------- */
body { font-size: 15px; }
.wrap { padding-block: 0 112px; max-width: 760px; }
.mono { font-family: var(--f-body); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1em; }
.top { padding-block: 18px 6px; align-items: center; }
.hello { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.15; margin: 0; }
.hello-sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.status { font-family: var(--f-body); font-size: 12px; letter-spacing: 0; border: 0; background: var(--surface); box-shadow: var(--shadow); padding: 6px 10px; }
.searchbar { position: relative; margin: 12px 0 16px; }
.searchbar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.searchbar input { width: 100%; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 13px 16px 13px 44px; font-size: 15px; }
.searchbar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* barra inferior */
.tabs.bottomnav { position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 10; margin: 0; border: 0; background: var(--surface); box-shadow: 0 -2px 14px rgba(20,28,48,.08); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; gap: 0; }
.bottomnav .tab { max-width: none; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); background: transparent; }
.bottomnav .tab[aria-selected="true"] { background: transparent; color: var(--accent); }
.bottomnav .tab svg { width: 24px; height: 24px; }
.fab { justify-self: center; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px rgba(15,159,122,.35); display: grid; place-items: center; cursor: pointer; transform: translateY(-14px); }
.fab svg { width: 28px; height: 28px; }
.fab:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
/* botones y chips */
.btn { border-radius: 999px; border: 0; background: var(--paper); font-weight: 700; padding: 10px 16px; }
.btn:hover { border-color: transparent; filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.small { padding: 7px 12px; }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1.5px var(--danger); }
.chip { border: 0; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; padding: 7px 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.eyebrow { font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: none; }
.note { border: 0; background: var(--accent-soft); color: var(--ink); border-radius: 14px; }
h2.sec, .sec-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 19px; margin: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 22px 0 10px; }
.sec-head .linkbtn { text-decoration: none; color: var(--accent); font-weight: 700; font-size: 14px; }
/* categorías con íconos */
.cats { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; width: 72px; display: grid; justify-items: center; gap: 6px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-size: 12.5px; font-weight: 600; }
.cat .ic { width: 60px; height: 60px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent); }
.cat .ic svg { width: 28px; height: 28px; }
.cat[aria-pressed="true"] .ic { background: var(--accent); color: var(--on-accent); }
.cat .n { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: -4px; }
.cat:focus-visible .ic { outline: 2px solid var(--accent); outline-offset: 2px; }
/* tarjetas */
.card { border: 0; border-radius: var(--r); box-shadow: var(--shadow); }
.card:hover { border-color: transparent; transform: translateY(-1px); }
.media { border-radius: 0; }
.card .media { aspect-ratio: 1; }
.card-name { font-weight: 700; }
.tag { border-radius: 999px; font-family: var(--f-body); font-weight: 700; text-transform: none; letter-spacing: 0; font-size: 11px; background: var(--surface); }

@media (min-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.outfit, .controls { border: 0; border-radius: var(--r); box-shadow: var(--shadow); }

.empty { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r); }
.tagline.ok { color: var(--accent); }

/* Animación de carga: una combinación de Wada que salta */
.loader { display: grid; justify-items: center; gap: 14px; padding-block: 56px; color: var(--muted); text-align: center; }
.loader-sw { display: flex; gap: 8px; }
.loader-sw span { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.loader p { margin: 0; font-size: 14px; }
.loader small { font-size: 12px; opacity: .8; }
.splash { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; place-items: center; transition: opacity .35s ease; }
.splash.out { opacity: 0; pointer-events: none; }
.splash .loader { padding-block: 0; }
.splash b { font-family: var(--f-display); font-size: 30px; color: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .loader-sw span { animation: hop .9s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-12px); } 55% { transform: translateY(0) scaleY(.9); } }
}

.pinbox { display: grid; gap: 6px; justify-items: start; }

/* ---------- Muestrario: el color manda ---------- */
/* Fondo neutro a propósito: no altera cómo se ven los colores de la ropa. El acento cambia con la paleta del día (lo fija el script). */
:root { --paper: #f3f3f1; --surface: #ffffff; --ink: #1c1d21; --muted: #6a6c73; --line: #e2e2de;
  --f-swatch: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; --pal-strip: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #141517; --surface: #1d1e21; --ink: #ededea; --muted: #9c9da3; --line: #2d2e32; } }
:root[data-theme="dark"] { --paper: #141517; --surface: #1d1e21; --ink: #ededea; --muted: #9c9da3; --line: #2d2e32; }
.hello { font-family: var(--f-swatch); font-weight: 700; }
.swname, .palette .pal span, .colorrow .nm b, .confirm .nm b, .sw .lbl b { font-family: var(--f-swatch); font-weight: 600; }
.linkbtn, .sec-head .linkbtn { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.tagline.ok, .step .mono { color: var(--ink); }
.bottomnav .tab[aria-selected="true"] { color: var(--ink); }
.bottomnav .tab::after { content: ""; width: 22px; height: 3px; border-radius: 2px; background: transparent; }
.bottomnav .tab[aria-selected="true"]::after { background: var(--pal-strip); }
.fab { box-shadow: 0 6px 16px rgba(0, 0, 0, .2); }
.add-opt .ic { background: var(--accent); color: var(--on-accent); }
/* Paleta de hoy */
.today { display: grid; gap: 10px; margin: 6px 0 2px; }
.today-head, .today-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.today-sw { display: flex; width: 100%; height: 156px; border: 0; padding: 0; border-radius: 18px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
.today-sw span { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 2px; padding: 10px; text-align: left; }
.today-sw b { font-family: var(--f-swatch); font-weight: 600; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere; }
.today-sw small { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.today-sw:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.today-have { display: flex; }
.hv { flex: 1; display: flex; justify-content: center; border: 0; background: none; padding: 0; cursor: pointer; }
.hv .media { width: 48px; aspect-ratio: 1; border-radius: 12px; box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--line); }
.missbox { width: 48px; height: 48px; border-radius: 12px; border: 2px dashed var(--muted); display: grid; place-items: center; color: var(--muted); }
.missbox svg { width: 20px; height: 20px; }
.today-foot > span { font-size: 14px; color: var(--muted); }
/* Clóset por color */
.cbar-wrap { display: grid; gap: 6px; margin-bottom: 12px; }
.cbar { display: flex; gap: 3px; overflow-x: auto; padding: 3px 2px; scrollbar-width: none; }
.cbar::-webkit-scrollbar { display: none; }
.cseg { min-width: 12px; height: 30px; border: 0; border-radius: 6px; padding: 0; cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.cseg[aria-pressed="true"] { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.cseg:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.type-chips { margin-top: 2px; }
/* Prendas como fichas de color */
.card.swatch { border-radius: 14px; overflow: hidden; }
.card.swatch .media { aspect-ratio: 1; }
.media.ico { display: grid; place-items: center; background: var(--paper); }
.media.ico svg { width: 50%; height: 50%; }
.chipband { display: grid; gap: 2px; padding: 8px 10px 10px; text-align: left; min-width: 0; }
.chipband .card-name { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chipband .row2 { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-width: 0; }
.chipband .swname { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chipband .extra { display: inline-flex; gap: 3px; flex: none; }
.chipband .extra i { width: 11px; height: 11px; border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .7); display: block; }

/* ---------- Franjas de color desplegables ---------- */
.bands-list { margin-inline: -16px; display: grid; }
.band { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); height: 72px; transition: height .45s cubic-bezier(.3, .7, .2, 1); cursor: pointer; text-align: left; }

.band:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.band-head { position: absolute; left: 20px; right: 20px; top: 0; height: 72px; display: flex; flex-direction: column; justify-content: center; transition: top .45s cubic-bezier(.3, .7, .2, 1); }
.band.open .band-head { top: 18px; height: auto; }
.band-k { font-family: var(--f-body); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; height: 0; opacity: 0; overflow: hidden; transition: opacity .3s, height .3s; }
.band.open .band-k { height: 16px; opacity: 1; }
.band-name { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.1; letter-spacing: -.01em; transition: font-size .45s cubic-bezier(.3, .7, .2, 1); overflow-wrap: anywhere; padding-right: 48px; }
.band.open .band-name { font-size: 34px; }
.band-body { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .25s; }
.band.open .band-body { opacity: 1; pointer-events: auto; transition: opacity .35s .15s; }
.specs { position: absolute; right: 20px; top: 112px; margin: 0; display: grid; gap: 10px; text-align: right; font-family: var(--f-display); }
.specs dt { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; font-family: var(--f-body); }
.specs dd { margin: 0; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.vlabel { position: absolute; left: 20px; bottom: 74px; transform: rotate(-90deg); transform-origin: left bottom; font-family: var(--f-body); font-size: 10.5px; font-weight: 700; letter-spacing: .32em; white-space: nowrap; }
.band-actions { position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.band-btn { border: 2px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 6px 12px; font-family: var(--f-body); font-weight: 700; font-size: 13px; cursor: pointer; }
.band-note { font-size: 12.5px; font-weight: 600; }
.pin-ico { width: 40px; height: 40px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); flex: none; }
.pin-ico svg { width: 36px; height: 36px; display: block; }
.pin-ico:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.band .pin-ico { position: absolute; right: 16px; top: 16px; }
.acc { position: relative; height: 500px; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.acc .band { height: auto; flex: 1 1 0; min-height: 56px; transition: flex-grow .5s cubic-bezier(.3, .7, .2, 1); }
.acc .band.open { flex-grow: 5; height: auto; }
.acc .band-head { height: 56px; }
.acc .band-name { font-size: 19px; }

.acc .specs { top: 96px; gap: 8px; }
.acc .vlabel { bottom: 22px; }
.acc .band-body .band-actions { display: none; }
.dict-tools { display: flex; gap: 10px; align-items: end; margin-bottom: 14px; }
@media (prefers-reduced-motion: reduce) { .band, .band-head, .band-name, .band-body, .acc .band { transition: none !important; } }

/* Descripciones amigables */
.band-tag { font-family: var(--f-body); font-size: 14.5px; font-weight: 600; line-height: 1.35; max-width: 80%; height: 0; opacity: 0; overflow: hidden; transition: opacity .3s; margin-top: 6px; }
.band.open .band-tag { height: auto; opacity: 1; }
.band.open { height: 410px; }
.specs { top: 158px; max-width: 64%; justify-items: end; }
.specs dt { text-transform: uppercase; }
.specs dd { font-size: 17px; line-height: 1.2; }
.acc { height: 560px; }
.acc .specs { top: 150px; }
.acc .band.open .band-name { font-size: 28px; }
/* Favoritos */
.fav-ico { position: absolute; right: 16px; top: 16px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .92); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .14); transition: transform .15s; }
.fav-ico svg { width: 22px; height: 22px; display: block; }
.fav-ico:active { transform: scale(.88); }
.fav-ico:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.band .fav-ico:not(.on) { background: transparent; box-shadow: none; color: var(--ink); }
.band .fav-ico:not(.on) svg path { stroke: currentColor; }
.fav-ico.on svg path { fill: #e0245e; stroke: #e0245e; }
.band .pin-ico { right: 64px; }
.band.no-fav .pin-ico { right: 16px; }
.band-name { padding-right: 56px; }
.fav-ico.pop { animation: favpop .35s ease; }
@keyframes favpop { 40% { transform: scale(1.3); } }
.dict-seg { display: flex; gap: 6px; margin: 4px 0 12px; }
.fav-empty { text-align: center; padding: 26px 18px; border: 2px dashed var(--line); border-radius: 18px; color: var(--muted); }
.fav-empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.fav-empty .fav-demo { display: inline-grid; vertical-align: middle; position: static; width: 30px; height: 30px; margin: 0 2px; pointer-events: none; }
.fav-empty .fav-demo svg { width: 18px; height: 18px; }
@media (prefers-reduced-motion: reduce) { .fav-ico.pop { animation: none; } }

/* ---------- Prendas planchadas ---------- */
.media.flatm { background: var(--paper); }
.media.flatm .flat { width: 100%; height: 100%; padding: 9%; box-sizing: border-box; display: block; filter: drop-shadow(0 6px 7px rgba(0, 0, 0, .16)); }
.hero-look { width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; display: grid; place-items: center; background: var(--paper); border-radius: var(--r); }
.hero-look svg { width: 86%; height: 86%; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .16)); }
.look-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.look-mode { border: 2px solid transparent; border-radius: 18px; background: var(--paper); padding: 8px 8px 10px; display: grid; gap: 6px; cursor: pointer; color: var(--ink); font: inherit; text-align: center; }
.look-mode b { font-family: var(--f-display); font-size: 14.5px; }
.look-mode[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.look-mode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.lm-img { aspect-ratio: 1; display: grid; place-items: center; border-radius: 12px; overflow: hidden; }
.lm-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lm-img.cut img { object-fit: contain; padding: 6%; box-sizing: border-box; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .16)); }
.lm-img svg { width: 92%; height: 92%; filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .16)); }
.fab-box { position: relative; border-radius: var(--r); overflow: hidden; background: repeating-conic-gradient(#cfcfca 0 25%, #ecece8 0 50%) 0 0 / 18px 18px; display: flex; justify-content: center; touch-action: none; cursor: crosshair; user-select: none; }
.fab-box img { max-width: 100%; max-height: 280px; display: block; pointer-events: none; -webkit-user-drag: none; }
.fab-sel { position: absolute; border: 2.5px solid #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .55), 0 0 0 9999px rgba(0, 0, 0, .32); border-radius: 6px; pointer-events: none; }

/* ---------- Pasarela de Combinar ---------- */
.pas-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pas-tools .btn svg { width: 16px; height: 16px; }
.anchor-chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 6px 6px 14px; margin-bottom: 12px; font-size: 13.5px; }
.anchor-chip .x { border: 0; background: var(--paper); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; color: var(--ink); }
.pasarela { position: relative; }
.stage { position: relative; aspect-ratio: 4 / 5; max-height: 62vh; margin-inline: auto; border-radius: 26px; overflow: hidden; background: #f1f1ef; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage { background: #2a2b2f; } }
:root[data-theme="dark"] .stage { background: #2a2b2f; }
.bgl, .layer { position: absolute; inset: 0; }
.pz { position: absolute; will-change: transform; }
.pz svg, .pz img { width: 100%; height: 100%; display: block; -webkit-user-drag: none; }
.pz svg { filter: drop-shadow(0 12px 10px rgba(0, 0, 0, .17)); }
.pz.photo img { object-fit: contain; filter: drop-shadow(0 12px 10px rgba(0, 0, 0, .2)); }
.pz.photo:not(.cut) img { object-fit: cover; border-radius: 16px; filter: none; box-shadow: 0 8px 18px rgba(0, 0, 0, .18); }
.pas-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 6; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .88); color: #1c1d21; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); display: grid; place-items: center; cursor: pointer; }
.pas-arrow svg { width: 20px; height: 20px; }
.pas-arrow.prev { left: 10px; } .pas-arrow.next { right: 10px; }
.pas-arrow:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pas-count { position: absolute; left: 14px; bottom: 12px; z-index: 6; background: rgba(255, 255, 255, .88); color: #1c1d21; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.pas-info { margin-top: 14px; display: grid; gap: 12px; }
.pas-strip { display: flex; height: 14px; border-radius: 999px; overflow: hidden; }
.pas-strip span { flex: 1; }
.pas-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pas-meta b { display: block; font-family: var(--f-display); font-size: 18px; }
.pas-meta .muted { font-size: 13px; }
.pas-acts { display: flex; gap: 8px; align-items: center; flex: none; }
.pas-acts .pin-ico { width: 38px; height: 38px; }
.pas-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pas-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.pas-list i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.pas-list .linkbtn { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pas-list .muted { font-size: 12.5px; white-space: nowrap; margin-left: auto; display: inline-flex; align-items: center; gap: 4px; }
.pas-list i.sm { width: 10px; height: 10px; border-radius: 3px; }
.pas-wada { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.pas-wada .muted { margin-right: 4px; }
.pas-wada i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.pas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pas-mini { border: 2px solid transparent; background: transparent; padding: 0; border-radius: 20px; cursor: pointer; display: grid; gap: 6px; text-align: left; color: var(--ink); font: inherit; }
.pas-mini.cur { border-color: var(--ink); }
.pas-mini .stage { border-radius: 18px; max-height: none; width: 100%; }
.pas-mini .pas-strip { height: 8px; margin-inline: 4px; }
.pas-mini .mini-no { font-size: 12.5px; font-weight: 700; padding: 0 6px 6px; }
.pas-mini:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.step .mono { white-space: nowrap; }
.adj-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* ---------- Probador por filas (Combinar) ---------- */
.dr-chips { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
.dr { margin-inline: -16px; background: #fbfbfa; display: grid; gap: 2px; padding: 12px 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dr { background: var(--surface); } }
:root[data-theme="dark"] .dr { background: var(--surface); }
.dr-row { height: clamp(80px, calc(var(--h) * 1vh), calc(var(--h) * 8.4px)); container-type: inline-size; }
.dr-row.dr-enter { animation: drIn .5s cubic-bezier(.2, .8, .25, 1) both; animation-delay: calc(var(--i) * 90ms); }
@keyframes drIn { from { transform: translateX(60%); opacity: 0; } }
.dr-track { position: relative; height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; padding-inline: 17cqw; overscroll-behavior-x: contain; touch-action: pan-x pan-y; }
.dr-track::-webkit-scrollbar { display: none; }
.dr-track.drag { scroll-snap-type: none; cursor: grabbing; }
.dr-track:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function rgbToLab(r, g, b) {
  const R = lin(r), G = lin(g), B = lin(b);
  const x = (R * 0.4124564 + G * 0.3575761 + B * 0.1804375) / 0.95047;
  const y = (R * 0.2126729 + G * 0.7151522 + B * 0.0721750);
  const z = (R * 0.0193339 + G * 0.1191920 + B * 0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  const fx = f(x), fy = f(y), fz = f(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function de76(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }
function de2000(c1, c2) {
  const [L1, a1, b1] = c1, [L2, a2, b2] = c2;
  const rad = Math.PI / 180, deg = 180 / Math.PI, p7 = Math.pow(25, 7);
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cb = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + p7)));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const hue = (b, a) => { if (b === 0 && a === 0) return 0; const x = Math.atan2(b, a) * deg; return x < 0 ? x + 360 : x; };
  const h1p = hue(b1, a1p), h2p = hue(b2, a2p);
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0) { dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * rad / 2);
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp;
  if (C1p * C2p === 0) hbp = h1p + h2p;
  else if (Math.abs(h1p - h2p) <= 180) hbp = (h1p + h2p) / 2;
  else hbp = (h1p + h2p + (h1p + h2p < 360 ? 360 : -360)) / 2;
  const T = 1 - 0.17 * Math.cos((hbp - 30) * rad) + 0.24 * Math.cos(2 * hbp * rad) + 0.32 * Math.cos((3 * hbp + 6) * rad) - 0.20 * Math.cos((4 * hbp - 63) * rad);
  const dTheta = 30 * Math.exp(-Math.pow((hbp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cbp, 7) / (Math.pow(Cbp, 7) + p7));
  const Sl = 1 + (0.015 * Math.pow(Lbp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbp - 50, 2));
  const Sc = 1 + 0.045 * Cbp, Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(2 * dTheta * rad) * Rc;
  return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2) + Rt * (dCp / Sc) * (dHp / Sh));
}

const W = RAW.map(([name, hex, combos, cmyk], i) => {
  const rgb = hexToRgb(hex), lab = rgbToLab(...rgb);
  return { i, name, hex: '#' + hex, rgb, lab, combos, cmyk: cmyk || [0, 0, 0, 0], light: lab[0] > 62 };
});
const COMBOS = (() => {
  const m = {};
  W.forEach(w => w.combos.forEach(n => { (m[n] = m[n] || []).push(w.i); }));
  return Object.keys(m).map(Number).sort((a, b) => a - b).map(no => ({ no, colors: m[no] }));
})();
const COMBO_BY_NO = Object.fromEntries(COMBOS.map(c => [c.no, c]));

function nearest(lab, n) {
  return W.map(w => ({ i: w.i, d: de2000(lab, w.lab) })).sort((a, b) => a.d - b.d).slice(0, n);
}
function isNeutralLab(lab) { return Math.hypot(lab[1], lab[2]) < 9 || lab[0] < 18; }

/* k-medias determinista sobre puntos {lab, rgb, w} */
function kmeans(points, k, iters) {
  if (!points.length) return [];
  k = Math.min(k, points.length);
  const cents = [points.reduce((a, b) => (b.w > a.w ? b : a)).lab.slice()];
  while (cents.length < k) {
    let best = null, bd = -1;
    for (const p of points) {
      let md = Infinity;
      for (const c of cents) md = Math.min(md, de76(p.lab, c));
      if (md > bd) { bd = md; best = p; }
    }
    cents.push(best.lab.slice());
  }
  let assign = new Array(points.length).fill(0);
  for (let it = 0; it < (iters || 12); it++) {
    for (let j = 0; j < points.length; j++) {
      let bi = 0, bd = Infinity;
      for (let c = 0; c < cents.length; c++) { const d = de76(points[j].lab, cents[c]); if (d < bd) { bd = d; bi = c; } }
      assign[j] = bi;
    }
    const acc = cents.map(() => ({ l: 0, a: 0, b: 0, w: 0 }));
    points.forEach((p, j) => { const s = acc[assign[j]]; s.l += p.lab[0] * p.w; s.a += p.lab[1] * p.w; s.b += p.lab[2] * p.w; s.w += p.w; });
    acc.forEach((s, c) => { if (s.w > 0) cents[c] = [s.l / s.w, s.a / s.w, s.b / s.w]; });
  }
  const out = cents.map(lab => ({ lab, r: 0, g: 0, b: 0, w: 0 }));
  let total = 0;
  points.forEach((p, j) => { const o = out[assign[j]]; o.r += p.rgb[0] * p.w; o.g += p.rgb[1] * p.w; o.b += p.rgb[2] * p.w; o.w += p.w; total += p.w; });
  return out.filter(o => o.w > 0).map(o => ({ lab: o.lab, rgb: [o.r / o.w, o.g / o.w, o.b / o.w], weight: o.w / total }));
}

/* Extrae hasta 3 colores dominantes de una imagen pequeña (RGBA).
   masked = true cuando la imagen ya viene recortada: se usan todos los píxeles visibles. */
function extractColors(data, w, h, masked) {
  const px = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const o = (y * w + x) * 4;
    if (data[o + 3] < 128) continue;
    const rgb = [data[o], data[o + 1], data[o + 2]];
    px.push({ x, y, rgb, lab: rgbToLab(...rgb), w: 1 });
  }
  if (!px.length) return [];
  if (masked) return clusterColors(px);
  const bw = Math.max(2, Math.round(Math.min(w, h) * 0.07));
  const isBorder = p => p.x < bw || p.y < bw || p.x >= w - bw || p.y >= h - bw;
  const border = px.filter(isBorder);
  const bg = kmeans(border, 2, 8).filter(c => c.weight > 0.25).map(c => c.lab);
  const cx = (w - 1) / 2, cy = (h - 1) / 2, maxd = Math.hypot(cx, cy);
  let fg = px.filter(p => !isBorder(p) && bg.every(b => de76(p.lab, b) > 16));
  if (fg.length < px.length * 0.12) fg = px.filter(p => Math.abs(p.x - cx) < w * 0.25 && Math.abs(p.y - cy) < h * 0.25);
  fg.forEach(p => { const d = Math.hypot(p.x - cx, p.y - cy) / maxd; p.w = 1 - 0.5 * d * d; });
  return clusterColors(fg);
}
function clusterColors(fg) {
  const cl = kmeans(fg, 4, 12).sort((a, b) => b.weight - a.weight);
  const merged = [];
  for (const c of cl) {
    const m = merged.find(k => de2000(k.lab, c.lab) < 10);
    if (m) {
      const t = m.weight + c.weight;
      m.lab = m.lab.map((v, i) => (v * m.weight + c.lab[i] * c.weight) / t);
      m.rgb = m.rgb.map((v, i) => (v * m.weight + c.rgb[i] * c.weight) / t);
      m.weight = t;
    } else merged.push({ lab: c.lab.slice(), rgb: c.rgb.slice(), weight: c.weight });
  }
  const keep = merged.filter(c => c.weight >= 0.08).sort((a, b) => b.weight - a.weight).slice(0, 3);
  const tot = keep.reduce((s, c) => s + c.weight, 0) || 1;
  return keep.map(c => {
    const near = nearest(c.lab, 1)[0];
    return {
      wada: near.i, de: round1(near.d), weight: Math.round(c.weight / tot * 100) / 100,
      lab: c.lab.map(round2), hex: rgbToHex(...c.rgb), measuredHex: rgbToHex(...c.rgb), manual: false
    };
  });
}
function round1(v) { return Math.round(v * 10) / 10; }
function round2(v) { return Math.round(v * 100) / 100; }

/* Motor de combinaciones */
const distCache = new WeakMap();
function gColors(g) { return (g.colors || []).filter(c => c.weight >= 0.12); }
function dist(g, w) {
  let m = distCache.get(g);
  if (!m) { m = new Map(); distCache.set(g, m); }
  if (m.has(w)) return m.get(w);
  let best = Infinity;
  for (const c of gColors(g)) {
    const d = de2000(c.lab, W[w].lab) + (1 - c.weight) * 4;
    if (d < best) best = d;
  }
  m.set(w, best);
  return best;
}
const SLOT_ORDER = ['outer', 'shoes'];
function suggest(pool, opts) {
  const T = opts.T, anchor = opts.anchorId ? pool.find(g => g.id === opts.anchorId) : null;
  const recent = opts.recent || new Set();
  const list = opts.onlyCombo ? [COMBO_BY_NO[opts.onlyCombo]] : COMBOS;
  const out = [];
  for (const combo of list) {
    const cands = [];
    for (const g of pool) {
      const m = [];
      for (const w of combo.colors) { const d = dist(g, w); if (d <= T) m.push({ w, d }); }
      m.sort((a, b) => a.d - b.d);
      if (m.length || g.neutral) cands.push({ g, m, best: m[0] || null });
    }
    let anchorCand = null;
    if (anchor) {
      anchorCand = cands.find(c => c.g === anchor);
      if (!anchorCand || (!anchorCand.best && !anchor.neutral)) continue;
    }
    const by = { top: [], bottom: [], dress: [], outer: [], shoes: [], acc: [] };
    for (const c of cands) (by[c.g.category] || by.acc).push(c);
    const rk = c => (c.best ? c.best.d : T + 6);
    for (const k in by) by[k].sort((a, b) => rk(a) - rk(b));
    const cap = a => a.slice(0, 7);
    let tops = cap(by.top), bottoms = cap(by.bottom), dresses = cap(by.dress);
    if (anchorCand && anchor.category === 'top') { tops = [anchorCand]; dresses = []; }
    if (anchorCand && anchor.category === 'bottom') { bottoms = [anchorCand]; dresses = []; }
    if (anchorCand && anchor.category === 'dress') { tops = []; dresses = [anchorCand]; }
    const bases = [];
    for (const t of tops) for (const b of bottoms) bases.push([t, b]);
    for (const d of dresses) bases.push([d]);
    let best = null;
    for (const base of bases) {
      const pieces = base.slice();
      if (anchorCand && ['outer', 'shoes', 'acc'].includes(anchor.category)) pieces.push(anchorCand);
      const covered = new Set();
      pieces.forEach(p => p.m.forEach(x => covered.add(x.w)));
      for (const slot of SLOT_ORDER) {
        if (pieces.some(p => p.g.category === slot)) continue;
        let pick = null, gain = 0;
        for (const c of cap(by[slot])) {
          const gn = c.m.filter(x => !covered.has(x.w)).length;
          if (gn > gain || (gn === gain && gn > 0 && pick && c.best.d < pick.best.d)) { pick = c; gain = gn; }
        }
        if (pick && gain > 0) { pieces.push(pick); pick.m.forEach(x => covered.add(x.w)); }
      }
      if (covered.size < combo.colors.length) continue;
      const assign = combo.colors.map(w => {
        let bp = null, bd = Infinity;
        for (const p of pieces) { const x = p.m.find(y => y.w === w); if (x && x.d < bd) { bd = x.d; bp = p; } }
        return { w, d: bd, g: bp.g };
      });
      const colored = pieces.filter(p => p.best).length;
      if (!colored) continue;
      const neutrals = pieces.length - colored;
      const key = pieces.map(p => p.g.id).sort().join(',');
      let score = assign.reduce((s, a) => s + a.d, 0) / assign.length + neutrals * 2.5;
      if (recent.has(key)) score += 6;
      if (!best || score < best.score) best = { combo, pieces: pieces.map(p => p.g), assign, score, key };
    }
    if (best) out.push(best);
  }
  out.sort((a, b) => a.score - b.score);
  const seen = new Set(), res = [];
  for (const o of out) {
    if (seen.has(o.key)) continue;
    seen.add(o.key); res.push(o);
    if (res.length >= (opts.limit || 30)) break;
  }
  return res;
}

  return `<svg class="flat" viewBox="${tight ? flatBox(look.shape).join(' ') : '0 0 200 200'}" role="img" aria-label="${esc((SHAPES[look.shape] || {}).label || 'Prenda')} planchada">

    <path d="${sh.body}" fill="url(#${pid})" stroke="rgba(0,0,0,.16)" stroke-width="1.2" stroke-linejoin="round"/>

    ${(sh.dots || []).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${dark ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.35)'}"/>`).join('')}

}

function media(g, tag) {
  const src = gSrc(g);
  let inner;

  else inner = `<img src="${esc(src)}" alt="" loading="lazy"${g.assetId && g.thumb ? ` data-fb="${esc(g.thumb)}"` : ''}>`;
  const t = tag && g.imagined ? `<span class="tag">${g.example ? 'Ejemplo' : 'Imaginada'}</span>` : '';

function fitLabel(score) { return score <= 7 ? 'Muy fiel' : score <= 12 ? 'Cercana' : 'Aproximada'; }
function textOn(w) { return w.light ? '#1b1d27' : '#f8f8f4'; }
function today() { return new Date().toLocaleDateString('en-CA'); }
function recentKeys() {
  const lim = Date.now() - 7 * 864e5, s = new Set();
  S.outfits.forEach(o => { if ((o.wornAt || []).some(d => Date.parse(d) >= lim)) s.add((o.garmentIds || []).slice().sort().join(',')); });

}
function savedFor(no, key) { return S.outfits.find(o => o.comboNo === no && (o.garmentIds || []).slice().sort().join(',') === key); }

/* ---------- Paleta del día: define el color de la app ---------- */
const PALETTES = COMBOS.filter(c => c.colors.length >= 3);
function dayIndex() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function todayCombo() { return PALETTES[(dayIndex() * 37 + ((S && S.palShift) || 0)) % PALETTES.length]; }
let PAL_NO = null;
function applyPalette() {
  const c = todayCombo();
  if (PAL_NO === c.no) return;
  PAL_NO = c.no;
  const cols = c.colors.map(i => W[i]);
  const chroma = w => Math.hypot(w.lab[1], w.lab[2]);
  let pick = cols.filter(w => w.lab[0] >= 28 && w.lab[0] <= 64).sort((a, b) => chroma(b) - chroma(a))[0];
  if (!pick) pick = cols.slice().sort((a, b) => Math.abs(a.lab[0] - 46) - Math.abs(b.lab[0] - 46))[0];
  const r = document.documentElement.style, n = cols.length;
  r.setProperty('--accent', pick.hex);
  r.setProperty('--on-accent', pick.lab[0] > 62 ? '#1c1d21' : '#ffffff');
  r.setProperty('--accent-soft', `rgba(${pick.rgb.join(', ')}, .14)`);
  r.setProperty('--pal-strip', `linear-gradient(to right, ${cols.map((w, k) => `${w.hex} ${(k * 100 / n).toFixed(2)}% ${((k + 1) * 100 / n).toFixed(2)}%`).join(', ')})`);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = pick.hex;
}
function mainW(g) { const c = gColors(g)[0] || (g.colors || [])[0]; return c ? c.wada : null; }
const PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
function paletteHero() {
  const c = todayCombo(), p = pool();
  const cells = c.colors.map(i => {
    let best = null, bd = Infinity;
    p.forEach(g => { const d = dist(g, i); if (d < bd) { bd = d; best = g; } });
    return { i, g: bd <= S.T ? best : null };
  });
  const have = cells.filter(x => x.g).length;
  return `<section class="today" aria-label="Paleta de hoy">
    <div class="today-head"><span class="eyebrow">Paleta de hoy · N.º ${c.no}</span><button class="linkbtn" data-action="next-palette">Ver otra</button></div>
    <button class="today-sw" data-action="open-combo" data-no="${c.no}" aria-label="Abrir la combinación ${c.no}">${c.colors.map(i => `<span style="background:${W[i].hex};color:${textOn(W[i])}"><b>${esc(W[i].name)}</b><small>${i + 1}</small></span>`).join('')}</button>
    <div class="today-have">${cells.map(x => x.g
      ? `<button class="hv" data-action="open-garment" data-id="${esc(x.g.id)}" aria-label="${esc(x.g.name)}">${media(x.g)}</button>`
      : `<button class="hv" data-action="imagine-from" data-w="${x.i}" aria-label="Imaginar una prenda ${esc(W[x.i].name)}"><span class="missbox">${PLUS_SVG}</span></button>`).join('')}</div>
    <div class="today-foot"><span>${have === c.colors.length ? 'Tienes todos los colores' : `Tienes ${have} de ${c.colors.length} colores`}</span><button class="btn primary small" data-action="open-combo" data-no="${c.no}">Vístete con ella</button></div>
  </section>`;
}
function colorBar(active) {
  const groups = new Map();
  active.forEach(g => { const w = mainW(g); if (w != null) groups.set(w, (groups.get(w) || 0) + 1); });
  if (!groups.size) return '';
  const ws = [...groups.keys()].sort((a, b) => a - b), sel = S.colorF, n = sel != null ? groups.get(sel) : 0;
  return `<div class="cbar-wrap"><span class="eyebrow">Tu clóset por color</span>
    <div class="cbar" role="group" aria-label="Filtrar por color">${ws.map(w => `<button class="cseg" data-action="color-filter" data-w="${w}" aria-pressed="${sel === w}" style="flex:${groups.get(w)};background:${W[w].hex}" title="${esc(W[w].name)}" aria-label="${esc(W[w].name)}, ${groups.get(w)} ${groups.get(w) === 1 ? 'prenda' : 'prendas'}"></button>`).join('')}</div>
    <span class="hint">${sel != null ? `<b class="swname">${esc(W[sel].name)}</b> · ${n} ${n === 1 ? 'prenda' : 'prendas'} · <button class="linkbtn" data-action="color-filter" data-w="${sel}">Quitar filtro</button>` : 'Toca un color para ver solo esas prendas. El ancho es cuántas tienes de cada uno.'}</span></div>`;
}
function catIconFill(id, hex) { return `<svg viewBox="0 0 24 24" fill="${hex}" stroke="var(--ink)" stroke-width="1.1" stroke-linejoin="round" aria-hidden="true">${CAT_ICON[id]}</svg>`; }

/* ---------- Animación de carga ---------- */
const LOADER_COMBO = todayCombo();
function loaderHtml(text) {
  return `<div class="loader" role="status"><div class="loader-sw" aria-hidden="true">${LOADER_COMBO.colors.map((i, k) => `<span style="background:${W[i].hex};animation-delay:${(k * 0.12).toFixed(2)}s"></span>`).join('')}</div><p>${esc(text)}</p><small>Combinación N.º ${LOADER_COMBO.no}</small></div>`;
}
const SPLASH_AT = Date.now();
function hideSplash() {
  const sp = document.getElementById('splash');
  if (!sp || sp.classList.contains('out')) return;
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 400); }, Math.max(0, 900 - (Date.now() - SPLASH_AT)));
}

/* ---------- Render ---------- */
function render() {
  const enInicio = S.tab === 'closet';
  const topEl = document.querySelector('.top'); if (topEl) topEl.hidden = !enInicio;
  const wrapEl = document.querySelector('.wrap'); if (wrapEl) wrapEl.classList.toggle('sin-saludo', !enInicio);
  applyPalette();
  if (S.loaded) hideSplash();
  const st = $('#status');
  st.dataset.mode = S.mode;
  st.textContent = { loading: 'Conectando…', cloud: 'Guardado en tu cuenta', local: IN_APP ? 'Guardado en este celular' : 'Solo en este navegador', error: 'Sin conexión con la base de datos' }[S.mode];
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
  const hello = $('#hello'); if (hello) hello.textContent = S.uname ? 'Hola, ' + S.uname : 'Hola';
  const hs = $('#hello-sub'); if (hs) hs.textContent = '¿Qué te pones hoy? · ' + new Date().toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' });
  const v = $('#view');
  const focusId = document.activeElement && document.activeElement.id;
  if (S.tab === 'closet') v.innerHTML = viewCloset();
  else if (S.tab === 'combine') { v.innerHTML = viewCombine(); mountDress(S.dr.enter); S.dr.enter = false; }
  else if (S.tab === 'saved') v.innerHTML = viewSaved();
  else v.innerHTML = viewDict();
  if (focusId && focusId.startsWith('f-')) { const el = document.getElementById(focusId); if (el) { el.focus(); if (el.setSelectionRange && el.type === 'search') el.setSelectionRange(el.value.length, el.value.length); } }
  renderSheet();
}

const CAT_ICON = {

  bottom: '<path d="M7 3h10l1 18h-4l-2-11-2 11H6z"/>',
  dress: '<path d="M9 3h6l-1 5 4 13H6l4-13z"/>',
  outer: '<path d="M8 3L3 7v14h6V11M16 3l5 4v14h-6V11M8 3l4 5 4-5M12 8v13"/>',
  shoes: '<path d="M3 17v-6l5-1 3 3 9 2v2zM3 20h18"/>',
  acc: '<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>'

function catIcon(id) { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CAT_ICON[id]}</svg>`; }
const SEARCH_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;
function fold(t) { return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function matchQuery(g, q) {
  if (!q) return true;
  const hay = fold([g.name, CAT[g.category] ? CAT[g.category].chip + ' ' + CAT[g.category].noun : '', ...gColors(g).map(c => W[c.wada].name + ' ' + colorWordEs(W[c.wada].lab))].join(' '));
  return fold(q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function addButtons() {
  return `<div class="actions">
    <label class="btn primary" for="in-camera">Fotografiar prenda</label>
    <label class="btn" for="in-gallery">Subir foto</label>
    <button class="btn" data-action="imagine">Imaginar prenda</button>
  </div>`;
}

function viewCloset() {
  if (!S.loaded) return loaderHtml('Cargando tu clóset…');
  const all = allGarments();
  const archived = all.filter(g => g.archived);
  const active = all.filter(g => !g.archived);
  const q = (S.query || '').trim().toLowerCase();
  if (S.colorF != null && !active.some(g => mainW(g) === S.colorF)) S.colorF = null;
  let list = S.filter === 'archived' ? archived : active.filter(g => S.filter === 'all' || g.category === S.filter);
  if (S.colorF != null && S.filter !== 'archived') list = list.filter(g => mainW(g) === S.colorF);
  list = list.filter(g => matchQuery(g, q)).sort((a, b) => realRank(a) - realRank(b) || (b.createdAt || 0) - (a.createdAt || 0));
  const counts = {}; active.forEach(g => { counts[g.category] = (counts[g.category] || 0) + 1; });
  const title = S.filter === 'archived' ? 'Archivadas' : 'Tu clóset';
  return `${paletteHero()}
    ${demoNote('closet')}
    ${S.mode === 'local' && !IN_APP ? `<p class="note">Estás fuera de tu cuenta: las prendas se guardan solo en este navegador.</p>` : ''}
    <div class="sec-head"><h2>${title}</h2><span class="eyebrow">${list.length} ${list.length === 1 ? 'prenda' : 'prendas'}</span></div>
    ${S.filter !== 'archived' ? colorBar(active) : ''}
    <div class="searchbar">${SEARCH_SVG}<input type="search" id="f-search" placeholder="Busca por prenda o color" value="${esc(S.query || '')}" aria-label="Buscar en tu clóset"></div>
    <div class="chips type-chips" role="group" aria-label="Tipo de prenda">
      ${S.filter === 'archived'
        ? `<button class="chip" data-action="filter" data-f="all" aria-pressed="false">Volver a todas</button>`
        : `<button class="chip" data-action="filter" data-f="all" aria-pressed="${S.filter === 'all'}">Todas<span class="n">${active.length}</span></button>${CATS.filter(c => counts[c.id]).map(c => `<button class="chip" data-action="filter" data-f="${c.id}" aria-pressed="${S.filter === c.id}">${c.chip}<span class="n">${counts[c.id]}</span></button>`).join('')}${archived.length ? `<button class="chip" data-action="filter" data-f="archived" aria-pressed="false">Archivadas<span class="n">${archived.length}</span></button>` : ''}`}
    </div>
    ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty" style="margin-top:12px">${q ? 'No encontré prendas con esa búsqueda.' : 'No hay prendas con este filtro.'}</div>`}`;
}
function viewSaved() {
  if (!S.loaded) return loaderHtml('Cargando…');
  const saved = S.outfits.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return `<div class="sec-head" style="margin-top:8px"><h2>Outfits guardados</h2><span class="eyebrow">${saved.length}</span></div>
    ${saved.length ? `<div class="outfits">${saved.map(savedCard).join('')}</div>` : `<div class="empty">Todavía no guardas outfits. En Combinar, toca Guardar en los que te gusten.</div>`}`;
}
function card(g) {
  const wi = mainW(g), w = wi != null ? W[wi] : null, src = gSrc(g);
  const tag = g.imagined ? `<span class="tag">${g.example ? 'Ejemplo' : 'Imaginada'}</span>` : '';
  const top = src ? media(g, true) : `<div class="media ico">${catIconFill(g.category, w ? w.hex : 'none')}${tag}</div>`;
  return `<button class="card swatch" data-action="open-garment" data-id="${esc(g.id)}">

      <span class="row2"><span class="swname">${w ? esc(w.name) + ' · ' + (w.i + 1) : ''}</span><span class="extra">${gColors(g).slice(1).map(c => `<i style="background:${W[c.wada].hex}"></i>`).join('')}</span></span>
    </span>
  </button>`;
}

function viewCombine() {
  if (!S.loaded) return loaderHtml('Cargando tu clóset…');
  const p = pool();
  if (!S.dr.init) {
    S.dr.init = true;
    const first = suggest(p, { T: S.T, recent: recentKeys(), limit: 1 })[0];
    if (first) { S.dr.extra.outer = first.pieces.some(g => g.category === 'outer'); S.dr.extra.acc = first.pieces.some(g => drRowOf(g) === 'acc'); first.pieces.forEach(g => { S.dr.sel[drRowOf(g)] = g.id; }); }
  }
  drRowsOn().forEach(k => { if (!drItems(k).length) delete S.dr.pin[k]; });
  const res = drComplete();
  S.pasRes = res;
  if (!(S.pasIdx >= 0 && S.pasIdx < res.length)) S.pasIdx = 0;
  if (S.dsearch) return drSearchBar(res.length) + drSearchHtml();
  const rows = drRowsOn();
  const chip = (k, l) => `<button class="chip" data-action="dr-extra" data-k="${k}" aria-pressed="${!!S.dr.extra[k]}">${S.dr.extra[k] ? '✓ ' : '+ '}${l}</button>`;
  return `${drSearchBar(res.length)}
    ${demoNote('combine')}
    <div class="chips dr-chips" role="group" aria-label="Filas extra">${chip('outer', 'Saco')}${chip('acc', 'Accesorio')}</div>
    <section class="dr" id="dr" aria-label="Probador: una fila por tipo de prenda">${rows.map((k, i) => drRowHtml(k, i)).join('')}</section>

}
function outfitCard(o) {

function paletteHtml(colors) {
  return `<div class="palette">${colors.map(i => `<div class="pal" style="background:${W[i].hex};color:${textOn(W[i])}"><span>${esc(W[i].name)}</span></div>`).join('')}</div>`;

function pieceHtml(g, assign) {
  const a = assign.find(x => x.g === g || x.g.id === g.id);
  const info = a ? `<i style="--c:${W[a.w].hex}"></i>${esc(W[a.w].name)} <span class="mono">ΔE ${round1(a.d)}</span>` : 'neutro';
  return `<li class="piece">${media(g)}<div style="min-width:0"><b>${esc(g.name)}</b><small>${esc(CAT[g.category] ? CAT[g.category].chip : '')} · ${info}</small></div></li>`;

function savedCard(o) {
  const gs = (o.garmentIds || []).map(findG);
  const missing = gs.some(g => !g);
  const combo = COMBO_BY_NO[o.comboNo] || { no: 0, colors: [...new Set(gs.filter(Boolean).map(mainW).filter(w => w != null))] };
  const worn = (o.wornAt || []).slice(-1)[0];
  const assign = missing ? [] : combo.colors.map(w => { let bg = null, bd = Infinity; gs.forEach(g => { const d = dist(g, w); if (d < bd) { bd = d; bg = g; } }); return { w, d: bd, g: bg }; }).filter(a => a.d <= 40);
  return `<article class="outfit">
    <div class="outfit-head"><span class="no">${o.comboNo ? 'N.º ' + o.comboNo : 'Mezcla libre'}</span><span class="fit">${worn ? 'Usado el ' + esc(worn) : 'Sin usar'}</span></div>
    ${paletteHtml(combo.colors)}
    ${missing ? `<p class="hint" style="padding:10px 12px;margin:0">Una de las prendas ya no está en tu clóset.</p>` : `<ul class="pieces">${gs.map(g => pieceHtml(g, assign)).join('')}</ul>`}
    <div class="outfit-foot">

function viewDict() {

    </div>
    ${view === 'fav' && !nf ? '' : `<div class="searchbar" style="margin-top:4px">${SEARCH_SVG}<input type="search" id="f-dict" placeholder="${view === 'fav' ? 'Busca en tus favoritos…' : 'Busca: rosado, calma, verano…'}" value="${esc(S.dictQuery)}" aria-label="Buscar color"></div>`}
    ${body}`;

/* ---------- Ideas para una prenda (funciona aunque el clóset esté vacío) ---------- */
const IDEA_SLOTS = { top: ['bottom', 'shoes', 'outer'], bottom: ['top', 'shoes', 'outer'], dress: ['shoes', 'outer', 'acc'], outer: ['top', 'bottom', 'shoes'], shoes: ['top', 'bottom', 'outer'], acc: ['top', 'bottom', 'shoes'] };
function ideasFor(g, limit) {
  const T = S.T, others = pool().filter(x => x.id !== g.id), out = [];
  for (const combo of COMBOS) {
    let gm = null;
    for (const w of combo.colors) { const d = dist(g, w); if (d <= T && (!gm || d < gm.d)) gm = { w, d }; }
    if (!gm) continue;
    const rest = combo.colors.filter(w => w !== gm.w && dist(g, w) > T);
    if (!rest.length) continue;
    const slots = (IDEA_SLOTS[g.category] || IDEA_SLOTS.top).slice(0, rest.length);
    const byL = rest.slice().sort((a, b) => W[a].lab[0] - W[b].lab[0]);
    const pieces = slots.map(s => {
      const w = s === 'top' ? byL.pop() : byL.shift();

      for (const x of others) if (x.category === s) { const d = dist(x, w); if (d < bd) { bd = d; best = x; } }
      return { slot: s, w, g: bd <= T ? best : null, d: bd };

/* ---------- Inspiración en Pinterest (enlace de búsqueda, sin copiar imágenes) ---------- */

  if (L < 20) return h >= 200 && h < 300 ? 'azul oscuro' : (h >= 300 || h < 45) ? 'vino' : 'negro';
  if (L > 62 && C < 36 && h > 40 && h < 105) return 'beige';
  if (h >= 345 || h < 45) { if (L > 62) return 'rosado'; if (C >= 45) return L < 35 ? 'vino' : 'rojo'; return L < 50 ? 'café' : 'terracota'; }
  if (h < 75) { if (L < 45) return 'café'; if (L > 80) return 'beige'; return L < 60 && C > 40 ? 'terracota' : 'naranja'; }
  if (h < 105) { if (L < 42) return 'café'; if (L < 65) return C > 40 ? 'mostaza' : 'oliva'; return 'amarillo'; }
  if (h < 130) return L < 60 ? 'oliva' : 'verde lima';

  if (h < 225) return L > 70 ? 'menta' : 'turquesa';

}

function toggleBand(el, single) {
  const list = el.parentElement;
  const wasOpen = el.classList.contains('open');
  if (single && wasOpen) return;
  list.querySelectorAll(':scope > .band.open').forEach(b => { b.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); });
  if (!wasOpen) {
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
    if (!single) { S.openBand = Number(el.dataset.w); setTimeout(() => el.scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }), 460); }
  } else if (!single) S.openBand = null;
}

/* ---------- Hojas ---------- */
function openSheet(type, data) { S.stack.push({ type, data: data || {} }); S.armed = null; renderSheet(); }
function closeSheet() { S.stack.pop(); S.armed = null; renderSheet(); }
function closeAll() { S.stack = []; S.armed = null; S.draft = null; S.imagine = null; renderSheet(); }
function renderSheet() {
  const sh = $('#sheet'), panel = $('#sheet-panel');
  const top = S.stack[S.stack.length - 1];
  if (!top) { if (!sh.hidden) { sh.hidden = true; panel.innerHTML = ''; } return; }
  const ae = document.activeElement, prevFocus = ae && ae.id;
  // Guardar dónde estaba el cursor para no perderlo al redibujar (si no, se escribe al revés)
  let sel = null; try { if (ae && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
  const scroll = panel.scrollTop;
  const back = S.stack.length > 1;
  const { title, body } = SHEETS[top.type](top.data);
  panel.innerHTML = `<div class="sheet-head"><h3 id="sheet-title">${title}</h3>
    <button class="btn small" data-action="${back ? 'back' : 'close-sheet'}">${back ? 'Volver' : 'Cerrar'}</button></div>
    <div class="sheet-body">${body}</div>`;
  const wasHidden = sh.hidden;
  sh.hidden = false;
  panel.scrollTop = wasHidden ? 0 : scroll;
  if (prevFocus) { const el = document.getElementById(prevFocus); if (el && panel.contains(el)) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  if (top.type === 'draft' && S.draft && S.draft.step === 'cut') mountCutter();
  if ($('#fab-box')) mountFabric();
}
function catChips(sel, action) {
  return `<div class="chips" role="group" aria-label="Tipo de prenda">${CATS.map(c => `<button class="chip" data-action="${action}" data-cat="${c.id}" aria-pressed="${sel === c.id}">${c.chip}</button>`).join('')}</div>`;
}
function colorRows(colors, target, editable) {
  return colors.map((c, k) => {
    const w = W[c.wada];
    return `<div class="colorrow${c.off ? ' off' : ''}">
      <span class="pair">${c.manual && !c.measuredHex ? '' : `<i style="--c:${esc(c.measuredHex || c.hex)}" title="Color medido"></i><em>→</em>`}<i style="--c:${w.hex}"></i></span>
      <span class="nm"><b>${esc(w.name)}</b><span><span class="mono">${Math.round(c.weight * 100)} %</span>${c.manual ? ' · elegido a mano' : ` · <span class="mono">ΔE ${c.de}</span>`}</span></span>
      ${editable ? `<span class="row"><button class="btn small" data-action="pick" data-target="${target}" data-ci="${k}">Cambiar</button>${target === 'draft' ? `<button class="btn small" data-action="toggle-color" data-ci="${k}">${c.off ? 'Usar' : 'Quitar'}</button>` : ''}</span>` : ''}
    </div>`;
  }).join('');
}

/* ---------- Recorte manual (varita, lazo, pinceles) ---------- */
const CUT_HELP = {
  wand: 'Toca el fondo: se borra todo lo conectado de un color parecido. Sube la tolerancia si deja manchas.',
  lasso: 'Dibuja con el dedo alrededor de la prenda: se borra todo lo que quede afuera.',

const LIN = new Float32Array(256).map((_, i) => lin(i));

  const y = (R * 0.2126729 + G * 0.7151522 + B * 0.0721750);

  const pts = [], step = Math.max(1, Math.round((w + h) / 300));
  for (let x = 0; x < w; x += step) { pts.push(x, (h - 1) * w + x); }
  for (let y = 0; y < h; y += step) { pts.push(y * w, y * w + w - 1); }
  const P = pts.map(i => ({ lab: [lab[i * 3], lab[i * 3 + 1], lab[i * 3 + 2]], rgb: [0, 0, 0], w: 1 }));
  const bg = kmeans(P, 3, 8).filter(k => k.weight > 0.15).map(k => k.lab);
  if (!bg.length) return false;
  const before = mask.slice(), t2 = 16 * 16;
  const near = i => bg.some(b => { const dl = lab[i * 3] - b[0], da = lab[i * 3 + 1] - b[1], db = lab[i * 3 + 2] - b[2]; return dl * dl + da * da + db * db <= t2; });

  for (const i of pts) tryPush(i);
  while (qh < qt) {
    const i = q[qh++]; mask[i] = 0;
    const x = i % w, y = (i / w) | 0;
    if (x > 0) tryPush(i - 1); if (x < w - 1) tryPush(i + 1);
    if (y > 0) tryPush(i - w); if (y < h - 1) tryPush(i + w);

    const xx = x + dx, yy = y + dy;
    if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
    const j = yy * w + xx; L += lab[j * 3]; A += lab[j * 3 + 1]; B += lab[j * 3 + 2]; n++;
  }
  L /= n; A /= n; B /= n;

  let qh = 0, qt = 0;

    if (seen[j]) return; seen[j] = 1;
    if (!mask[j]) return;

    if (dl * dl + da * da + db * db <= t2) q[qt++] = j;

  while (qh < qt) {
    const i = q[qh++]; mask[i] = 0;
    const xx = i % w, yy = (i / w) | 0;
    if (xx > 0) tryPush(i - 1); if (xx < w - 1) tryPush(i + 1);
